<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Grid Prix — F1 Mind Games</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e10600">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --red:#e10600; --red-dark:#a30500; --dark:#0c0c0e; --panel:#17181c;
    --panel2:#1f2126; --text:#f2f2f2; --muted:#9a9ba2; --green:#00d26a;
    --amber:#ffb400; --gridline:#33353b;
    --font-display:"Barlow Condensed",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:"JetBrains Mono",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--dark);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none; touch-action:manipulation;}
  body{background:
      radial-gradient(circle at 15% 0%, #2a0505 0%, transparent 45%),
      radial-gradient(circle at 100% 100%, #0a1a12 0%, transparent 45%),
      var(--dark);
    min-height:100%; display:flex; flex-direction:column;}

  .stripe{height:6px; background:repeating-linear-gradient(90deg,#fff 0 24px,var(--red) 24px 48px);}

  header{padding:14px 16px 10px; text-align:center; position:relative;}
  header h1{margin:0; font-family:var(--font-display); font-size:2rem; letter-spacing:1px; font-weight:800;
    text-transform:uppercase; display:flex; align-items:center; justify-content:center; gap:8px;}
  header h1 svg{width:1em; height:1em; color:var(--red);}
  header h1 span{color:var(--red);}
  header p{margin:4px 0 0; color:var(--muted); font-size:.8rem;}

  main{flex:1; display:flex; flex-direction:column; align-items:center; padding:8px 12px 32px; gap:14px;}

  /* ---- Menu ---- */
  #menu{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; width:100%; max-width:900px;}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--gridline);
    border-radius:14px; padding:18px; cursor:pointer; transition:transform .15s, border-color .15s; position:relative; overflow:hidden;}
  .card:active{transform:scale(.97);}
  .card:hover{border-color:var(--red);}
  .card .num{position:absolute; top:10px; right:14px; font-size:2.4rem; font-weight:900; color:rgba(255,255,255,.06);}
  .card h2{margin:0 0 6px; font-family:var(--font-display); font-size:1.4rem; letter-spacing:.3px;}
  .card p{margin:0; color:var(--muted); font-size:.85rem; line-height:1.4;}
  .card .best{margin-top:10px; font-size:.75rem; color:var(--amber);}
  .card .barwrap{margin-top:10px; height:6px; border-radius:4px; background:var(--gridline); overflow:hidden;}
  .card .barfill{height:100%; background:var(--red);}

  /* ---- Shared game chrome ---- */
  .gamewrap{width:100%; max-width:640px; display:flex; flex-direction:column; gap:10px; align-items:center;}
  .topbar{width:100%; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;}
  .btn{background:var(--panel2); border:1px solid var(--gridline); color:var(--text); padding:8px 14px;
    border-radius:8px; font-size:.85rem; cursor:pointer; font-weight:600;}
  .btn:active{transform:scale(.96);}
  .btn.primary{background:var(--red); border-color:var(--red-dark);}
  .btn.small{padding:6px 10px; font-size:.75rem;}
  .stat{background:var(--panel2); border:1px solid var(--gridline); border-radius:8px; padding:6px 12px; font-size:.8rem; color:var(--muted);
    display:inline-flex; align-items:center; gap:6px;}
  .stat svg{width:1em; height:1em; color:var(--amber);}
  .stat b{color:var(--text); font-family:var(--font-mono); font-weight:700; letter-spacing:.5px;}
  #msg{min-height:22px; font-size:.9rem; font-weight:600; color:var(--green); text-align:center;}
  #msg.err{color:var(--red);}

  /* ---- Level select ---- */
  .lvlHeader{display:flex; flex-direction:column; align-items:center; gap:4px; width:100%; max-width:640px;}
  .lvlHeader h2{font-family:var(--font-display); font-size:1.6rem; letter-spacing:.3px;}
  .lvlProgress{font-size:.8rem; color:var(--muted);}
  #levelGrid{display:grid; grid-template-columns:repeat(10,1fr); gap:6px; width:100%; max-width:640px;}
  .lvlbtn{aspect-ratio:1; border-radius:8px; border:1px solid var(--gridline); background:var(--panel2);
    color:var(--text); font-family:var(--font-mono); font-size:.75rem; font-weight:700; display:flex; align-items:center; justify-content:center;
    cursor:pointer; position:relative;}
  .lvlbtn.locked{opacity:.35; cursor:not-allowed;}
  .lvlbtn.done{background:var(--green); color:#04240f; border-color:var(--green);}
  .lvlbtn.current{border-color:var(--red); box-shadow:0 0 0 2px var(--red) inset;}
  @media (max-width:480px){ #levelGrid{grid-template-columns:repeat(8,1fr);} }

  /* ---- Sudoku ---- */
  #sudokuGrid{display:grid; grid-template-columns:repeat(9,1fr); gap:2px; background:var(--gridline);
    border:2px solid var(--red); border-radius:6px; width:min(92vw,480px); aspect-ratio:1; overflow:hidden;}
  .sc{background:var(--panel2); display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:clamp(11px,3.6vw,20px); font-weight:700; cursor:pointer; user-select:none; position:relative;}
  .sc.given{background:#20232a; color:var(--text); cursor:default;}
  .sc.filled{background:#232c3a;}
  .sc.filled.conflict{background:#3a1e1e;}
  .sc.selected{background:#3a1414;}
  .sc.conflict{color:var(--red); }
  .sc.boxR{border-right:2px solid var(--red);}
  .sc.boxB{border-bottom:2px solid var(--red);}
  @keyframes scBurst{
    0%{box-shadow:0 0 0 0 rgba(0,210,106,.85); background-color:rgba(0,210,106,.4);}
    100%{box-shadow:0 0 0 6px rgba(0,210,106,0); background-color:transparent;}
  }
  .sc.sc-burst{animation:scBurst .6s ease-out;}
  @keyframes gridWinPulse{0%{transform:scale(1);}45%{transform:scale(1.015);}100%{transform:scale(1);}}
  #sudokuGrid.sc-grid-complete{animation:gridWinPulse .6s ease;}
  @media (prefers-reduced-motion: reduce){
    .sc.sc-burst{ animation:none !important; }
    #sudokuGrid.sc-grid-complete{ animation:none !important; }
  }
  .notesGrid{display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    width:100%; height:100%; padding:1px;}
  .notesGrid span{display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:clamp(6px,1.6vw,9px); font-weight:600; color:var(--amber);}
  .padnum button.active{background:var(--red); border-color:var(--red-dark);}
  .padnum{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; width:min(92vw,480px);}
  .padnum button{padding:12px 0; font-size:1.1rem; font-weight:700; background:var(--panel2);
    border:1px solid var(--gridline); border-radius:8px; color:var(--text);}
  .padnum button:active{background:var(--red);}

  /* ---- Word hunt ---- */
  .whGridWrap{position:relative; width:min(92vw,460px); aspect-ratio:1;}
  #whGrid{display:grid; gap:1px; background:var(--gridline); border:2px solid var(--red); border-radius:6px; overflow:hidden;
    width:100%; height:100%; touch-action:none;}
  .whOverlay{position:absolute; inset:0; pointer-events:none; overflow:visible;}
  .wc{background:var(--panel2); display:flex; align-items:center; justify-content:center;
    font-size:clamp(9px,3vw,16px); font-weight:700; user-select:none;}
  .wc.found{color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.7);}
  #whWords{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:480px;}
  .wchip{background:var(--panel2); border:1px solid var(--gridline); padding:4px 10px; border-radius:20px; font-size:.75rem; color:var(--muted);}
  .wchip.done{background:var(--green); color:#04240f; border-color:var(--green); text-decoration:line-through;}

  /* ---- Crossword ---- */
  #cwGrid{display:grid; gap:1px; background:var(--gridline); border:2px solid var(--red); border-radius:6px; overflow:hidden;
    width:min(92vw,460px);}
  .cc{background:var(--panel2); position:relative; display:flex; align-items:center; justify-content:center; aspect-ratio:1;}
  .cc.block{background:transparent;}
  .cc input{width:100%; height:100%; background:transparent; border:none; color:var(--text); text-align:center;
    font-size:clamp(11px,3.2vw,18px); font-weight:700; text-transform:uppercase; outline:none;}
  .cc.active input{background:#3a1414;}
  .cc .clueNum{position:absolute; top:1px; left:2px; font-size:8px; color:var(--muted);}
  .cc.wrong input{color:var(--red);}
  .cc.correct input{color:var(--green);}
  #cwClue{background:var(--panel2); border:1px solid var(--gridline); border-radius:8px; padding:8px 14px;
    font-size:.85rem; width:100%; max-width:460px; text-align:center; min-height:20px;}
  #cwClueList{width:100%; max-width:480px; display:flex; flex-direction:column; gap:4px; font-size:.75rem; color:var(--muted);}
  #cwClueList .grp b{color:var(--text);}
  #cwClueList div.line{cursor:pointer;}
  #cwClueList div.line.solved{color:var(--green); text-decoration:line-through;}

  footer{text-align:center; color:var(--muted); font-size:.7rem; padding:10px 10px 46px; opacity:.6;}

  /* ---- Racing strip decoration (empty-space flair): 22-car grid ---- */
  #muteToggle{position:fixed; top:10px; right:10px; z-index:40; width:38px; height:38px; border-radius:50%;
    background:var(--panel2); border:1px solid var(--gridline); color:var(--text); font-size:1.1rem;
    cursor:pointer; display:flex; align-items:center; justify-content:center;}
  #bgmToggle{position:fixed; top:10px; right:56px; z-index:40; width:38px; height:38px; border-radius:50%;
    background:var(--panel2); border:1px solid var(--gridline); color:var(--text); font-size:1.1rem;
    cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .statBlock{margin:12px 0;}
  .statRow{display:flex; justify-content:space-between; padding:6px 0; font-size:.85rem; border-bottom:1px solid var(--gridline);}
  .statRow span:first-child{color:var(--muted);}
  .statRow span:last-child{font-family:var(--font-mono); font-weight:700; color:var(--text);}
  .statDivider{height:10px;}
  #profileBadge{position:fixed; top:10px; left:10px; z-index:40; display:flex; align-items:center; gap:8px;
    background:var(--panel2); border:1px solid var(--gridline); border-radius:22px; padding:4px 12px 4px 4px;
    cursor:pointer; max-width:calc(100vw - 60px);}
  #profileBadge img{width:32px; height:32px; border-radius:50%; background:var(--dark); flex-shrink:0;}
  #profileBadge .profileText{font-size:.78rem; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .avatarGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(56px,1fr)); gap:8px; max-height:260px; overflow-y:auto; margin:12px 0;}
  .avatarChoice{width:56px; height:56px; border-radius:50%; border:3px solid transparent; background:var(--dark);
    cursor:pointer; padding:4px;}
  .avatarChoice img{width:100%; height:100%;}
  .avatarChoice.selected{border-color:var(--red);}
  .raceLane{position:fixed; left:0; right:0; bottom:0; height:40px; overflow:hidden; pointer-events:none; z-index:0;}
  .raceLane::before{content:""; position:absolute; inset:0; top:2px;
    background:repeating-linear-gradient(90deg,var(--gridline) 0 22px,transparent 22px 44px);
    height:2px; top:50%; margin-top:-1px; opacity:.6;}
  .raceCar{position:absolute; bottom:2px; left:-90px; width:72px; height:30px; opacity:.7;
    animation-name:raceAcross; animation-timing-function:linear; animation-iteration-count:infinite;
    animation-fill-mode:backwards;}
  .raceCar svg{width:100%; height:100%; color:inherit; transform:scaleX(-1);}
  .raceCar .wheel{animation:wheelSpin .3s linear infinite; transform-origin:center; transform-box:fill-box;}
  @keyframes raceAcross{
    from{ left:-90px; }
    to{ left:100%; }
  }
  @keyframes wheelSpin{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }
  @media (prefers-reduced-motion: reduce){
    .raceCar{ animation:none !important; }
    .raceCar .wheel{ animation:none !important; }
  }
  @media (max-width:520px){ .raceLane{ display:none; } }

  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .modal{background:var(--panel); border:1px solid var(--red); border-radius:14px; padding:28px; text-align:center; max-width:340px;}
  .modal h2{margin:0 0 8px; color:var(--red);}
  .modal p{color:var(--muted); margin-bottom:16px;}
  .modal .modalbtns{display:flex; flex-direction:column; gap:8px;}
  .modal.wide{max-width:480px; text-align:left; max-height:80vh; overflow-y:auto;}
  .modal.wide h2{text-align:center;}
  .offlineSteps{list-style:none; margin:0 0 16px; padding:0; display:flex; flex-direction:column; gap:14px;}
  .offlineSteps li{display:flex; gap:12px; align-items:flex-start;}
  .offlineSteps .stepIcon{flex:0 0 auto; width:44px; height:44px; border-radius:10px; background:var(--panel2); border:1px solid var(--gridline); display:flex; align-items:center; justify-content:center; color:var(--red);}
  .offlineSteps .stepIcon svg{width:24px; height:24px;}
  .offlineSteps .stepText b{display:block; color:var(--text); margin-bottom:2px;}
  .offlineSteps .stepText span{color:var(--muted); font-size:.85rem; line-height:1.5;}
  .linkBtn{background:none; border:none; color:inherit; text-decoration:underline; font:inherit; cursor:pointer; padding:6px 0; margin-top:4px;}
  .linkBtn:hover{color:var(--red);}
  .offlineSteps code{background:var(--panel2); border:1px solid var(--gridline); border-radius:4px; padding:1px 5px; color:var(--text); font-family:var(--font-mono); font-size:.8em;}

  /* ---- Achievement toast ---- */
  .achToast{position:fixed; left:50%; bottom:56px; transform:translate(-50%,20px); z-index:60;
    background:linear-gradient(135deg,var(--panel),var(--panel2)); border:1px solid var(--amber);
    border-radius:12px; padding:12px 18px; display:flex; align-items:center; gap:12px;
    box-shadow:0 8px 30px rgba(0,0,0,.5); opacity:0; transition:opacity .35s, transform .35s;
    max-width:min(92vw,360px); pointer-events:none;}
  .achToast.show{opacity:1; transform:translate(-50%,0);}
  .achToastLabel{font-size:.65rem; text-transform:uppercase; letter-spacing:1px; color:var(--amber); font-weight:700;}
  .achToastTitle{font-family:var(--font-display); font-size:1.1rem; font-weight:700;}
  .achToastDesc{font-size:.75rem; color:var(--muted);}

  /* ---- Collectible badge (shared by toast icon + achievement cards) ---- */
  .badge{width:52px; height:52px; min-width:52px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:1.5rem; border:3px solid var(--gridline); background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.18), transparent 60%), var(--panel2);
    box-shadow:0 2px 8px rgba(0,0,0,.4);}
  .achCard.locked .badge{filter:grayscale(1) brightness(.55);}

  /* ---- Achievements screen ---- */
  #achGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; width:100%; max-width:900px;}
  .themeGrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; max-width:760px; width:100%; margin:0 auto;}
  .themeCard{background:var(--panel2); border:2px solid var(--gridline); border-radius:12px; padding:12px; cursor:pointer; text-align:left; font-family:inherit;}
  .themeCard.active{border-color:var(--text);}
  .themeSwatch{width:100%; height:44px; border-radius:8px; margin-bottom:8px;}
  .themeLabel{color:var(--text); font-size:.82rem; font-weight:700;}
  .achCard{background:var(--panel2); border:1px solid var(--gridline); border-radius:12px; padding:14px; display:flex; gap:12px; align-items:flex-start;}
  .achCard.locked{opacity:.65;}
  .achTier{font-size:.62rem; text-transform:uppercase; letter-spacing:1px; font-weight:700;}
  .achCard .achTitle{font-family:var(--font-display); font-size:1.05rem; font-weight:700;}
  .achCard .achDesc{font-size:.78rem; color:var(--muted); margin-top:2px;}
  .achGoalProgress{font-size:.72rem; color:var(--text); margin-top:6px; font-family:var(--font-mono); opacity:.85;}
  .achProgress{font-size:.8rem; color:var(--muted); text-align:center; line-height:1.6;}

  /* ---- Leaderboard: top-down starting grid ---- */
  .lbTabs{display:flex; gap:8px; justify-content:center; margin:10px 0 18px; flex-wrap:wrap;}
  .lbTabs button.active{background:var(--red); border-color:var(--red-dark);}
  .trackWrap{max-width:460px; width:100%; margin:0 auto; border-radius:14px; overflow:hidden; border:1px solid var(--gridline);}
  .startLine{height:16px; background-image:
      linear-gradient(45deg,#111 25%, transparent 25%, transparent 75%, #111 75%),
      linear-gradient(45deg,#111 25%, transparent 25%, transparent 75%, #111 75%);
    background-size:16px 16px; background-position:0 0,8px 8px; background-color:#fff;}
  .trackBody{position:relative; padding:20px 22px 4px; background:linear-gradient(180deg,#242424,#1a1a1a);}
  .trackBody::before{content:""; position:absolute; left:50%; top:0; bottom:0; border-left:3px dashed rgba(255,255,255,.22); transform:translateX(-50%);}
  .gridBoxRow{display:flex; gap:16px; position:relative; z-index:1;}
  .gridBox{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; padding:6px 4px 14px; margin-bottom:14px;}
  .gridBox.offset{margin-top:24px;}
  .gridBox .gridPositionLine{width:70%; height:3px; background:rgba(255,255,255,.4); border-radius:2px; margin-top:6px;}
  .gridBox.you .gridPositionLine{background:var(--red); box-shadow:0 0 6px var(--red);}
  .gridBox.empty{opacity:.28;}
  .gridBox .slotCarTD{width:30px; height:50px; margin-bottom:4px;}
  .gridBox .slotCarTD svg{width:100%; height:100%;}
  .gridBox .pos{font-family:var(--font-mono); font-weight:800; font-size:.72rem; color:#fff; letter-spacing:.5px;}
  .gridBox .slotName{font-weight:700; font-size:.74rem; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; color:#fff;}
  .gridBox .slotTime{font-family:var(--font-mono); font-size:.66rem; color:#bbb;}
  .lbForm{max-width:460px; width:100%; margin:22px auto 0; background:var(--panel2); border:1px solid var(--gridline);
    border-radius:12px; padding:16px;}
  .lbForm h3{margin:0 0 10px; font-family:var(--font-display); font-size:1.05rem;}
  .lbForm input[type=text]{width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--gridline);
    background:var(--dark); color:var(--text); font-size:.9rem; margin-bottom:10px;}
  .colorSwatches{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
  .swatch{width:34px; height:34px; border-radius:50%; border:3px solid transparent; cursor:pointer; padding:0;}
  .swatch.selected{border-color:var(--text);}
  .lbLabel{font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:2px 0 6px;}
  .designSwatch{width:40px; height:52px; border-radius:8px; border:2px solid transparent; cursor:pointer; padding:2px; background:var(--dark);}
  .designSwatch svg{width:100%; height:100%; transform:rotate(0deg);}
  .designSwatch.selected{border-color:var(--text);}
  .lbNote{font-size:.75rem; color:var(--muted); margin-top:8px; line-height:1.5;}
</style>
</head>
<body>
<div class="stripe"></div>
<header>

<script type="module">
  // Shared global leaderboard backend (Firestore). Config is filled in once
  // the project owner creates a free Firebase project — see README/chat for
  // setup steps. Until then `configured` is false and the UI shows a
  // "not connected yet" state instead of erroring.
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, collection, doc, setDoc, getDocs, query, orderBy, limit }
    from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAsAunmT8TqY655xnkL64hAJUy8QQdzODk",
    authDomain: "grid-prix.firebaseapp.com",
    projectId: "grid-prix",
    storageBucket: "grid-prix.firebasestorage.app",
    messagingSenderId: "582349761542",
    appId: "1:582349761542:web:ee8e5eb6b3f1781d47e787"
  };
  const configured = firebaseConfig.apiKey !== "PASTE_ME";
  let db = null;
  if(configured){
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
  }
  const GAME_IDS = ["sudoku", "wordhunt", "crossword"];
  function collFor(gameId){
    if(!GAME_IDS.includes(gameId)) throw new Error("unknown game " + gameId);
    return "leaderboard_" + gameId;
  }
  window.gridPrixLeaderboard = {
    configured,
    async submit(gameId, clientId, name, completed, carColor, helmet){
      await setDoc(doc(db, collFor(gameId), clientId), { name, completed, carColor, helmet, updatedAt: Date.now() });
    },
    async fetchTop20(gameId){
      const q = query(collection(db, collFor(gameId)), orderBy("completed", "desc"), limit(20));
      const snap = await getDocs(q);
      return snap.docs.map(d=> ({ id: d.id, ...d.data() }));
    }
  };

  if("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
<script>
(function(){
"use strict";

const MAX_LEVEL = 100;

/* ============ Theme (accent colorway) ============
   Witty color-inspired names, not real team names/logos — same posture as
   the car livery colors elsewhere in the game. */
const THEMES = [
  { id:"classic",   label:"Podium Classic",     accent:"#e10600", accentDark:"#a30500" },
  { id:"papaya",     label:"Papaya Blaze",       accent:"#FF8000", accentDark:"#cc6600" },

  { id:"tricolore",  label:"Tricolore Blue",     accent:"#2293D1", accentDark:"#14648f" },
  { id:"grove",      label:"Grove Racing Blue",  accent:"#3DA5E0", accentDark:"#1f6fa0" },
  { id:"juniorbulls",label:"Junior Bulls Navy",  accent:"#4C6FFF", accentDark:"#2c46b8" },
  { id:"starstripes",label:"Stars & Stripes Red",accent:"#C8102E", accentDark:"#96001f" },
  { id:"hornet",     label:"Swiss Hornet Green", accent:"#3AA655", accentDark:"#1f7a3b" }
];
const THEME_KEY = "gridprix_theme_v1";
function applyTheme(id){
  const t = THEMES.find(x=>x.id===id) || THEMES[0];
  document.documentElement.style.setProperty("--red", t.accent);
  document.documentElement.style.setProperty("--red-dark", t.accentDark);
  localStorage.setItem(THEME_KEY, t.id);
}
applyTheme(localStorage.getItem(THEME_KEY) || "classic");

/* ============ Seeded RNG ============ */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashSeed(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rngFor(gameId, level){ return mulberry32(hashSeed(gameId+":"+level)); }
function shuffleRng(arr, rng){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function difficultyT(level){ return clamp((level-1)/(MAX_LEVEL-1), 0, 1); } // 0 (easy) .. 1 (hard)

/* ============ Progress storage ============ */
const LS_KEY = "gridprix_progress_v2";
function loadProgress(){
  try{
    const p = JSON.parse(localStorage.getItem(LS_KEY));
    if(p){
      if(p.sudoku && p.sudoku.hints == null) p.sudoku.hints = 0;
      return p;
    }
  }catch(e){}
  return {
    sudoku:{unlocked:1, times:{}, hints:0},
    wordhunt:{unlocked:1, times:{}},
    crossword:{unlocked:1, times:{}}
  };
}
function saveProgress(p){ localStorage.setItem(LS_KEY, JSON.stringify(p)); }
function completeLevel(gameId, level, seconds, meta){
  meta = meta || {};
  const p = loadProgress();
  const g = p[gameId];
  if(!g.times[level] || seconds < g.times[level]) g.times[level] = seconds;
  if(level >= g.unlocked && g.unlocked < MAX_LEVEL) g.unlocked = level + 1;
  if(gameId === "sudoku"){
    g.hints = (g.hints||0) + 1;
    if(meta.mistakes === 0) g.flawlessCount = (g.flawlessCount||0) + 1;
    if(meta.mistakes === 2) g.comebackWins = (g.comebackWins||0) + 1;
  }
  p.streak = (p.streak||0) + 1;
  saveProgress(p);
  checkAchievements(p);
  return p;
}
function resetStreak(){
  const p = loadProgress();
  p.streak = 0;
  saveProgress(p);
}

/* ============ Achievements ============ */
const ACH_KEY = "gridprix_achievements_v1";
function loadAchievements(){
  try{ return JSON.parse(localStorage.getItem(ACH_KEY)) || {}; }catch(e){ return {}; }
}
function saveAchievements(a){ localStorage.setItem(ACH_KEY, JSON.stringify(a)); }

function totalCompleted(p){
  return ["sudoku","wordhunt","crossword"].reduce((sum,g)=> sum + Object.keys(p[g].times).length, 0);
}
function fastestTime(p){
  let min = Infinity;
  ["sudoku","wordhunt","crossword"].forEach(g=> Object.values(p[g].times).forEach(t=>{ if(t<min) min=t; }));
  return min;
}

const TIER_COLORS = { bronze:"#cd7f32", silver:"#c9d1d9", gold:"#ffd54a", platinum:"#7fe8ff" };

const ACHIEVEMENTS = [
  {id:"first_win", icon:"🏁", tier:"bronze", title:"Lights Out", desc:"Complete your first level",
    test:p=> totalCompleted(p) >= 1, progress:p=> `${Math.min(totalCompleted(p),1)}/1`},
  {id:"triple_rookie", icon:"🎽", tier:"bronze", title:"Rookie Season", desc:"Complete level 1 in all three games",
    test:p=> p.sudoku.times[1]!=null && p.wordhunt.times[1]!=null && p.crossword.times[1]!=null,
    progress:p=> `${["sudoku","wordhunt","crossword"].filter(g=>p[g].times[1]!=null).length}/3 games`},
  {id:"levels_10", icon:"🏆", tier:"bronze", title:"Race Winner", desc:"Complete 10 levels total",
    test:p=> totalCompleted(p) >= 10, progress:p=> `${Math.min(totalCompleted(p),10)}/10`},
  {id:"levels_50", icon:"🥇", tier:"gold", title:"Grand Slam", desc:"Complete 50 levels total",
    test:p=> totalCompleted(p) >= 50, progress:p=> `${Math.min(totalCompleted(p),50)}/50`},
  {id:"levels_100", icon:"👑", tier:"platinum", title:"World Champion", desc:"Complete 100 levels total",
    test:p=> totalCompleted(p) >= 100, progress:p=> `${Math.min(totalCompleted(p),100)}/100`},
  {id:"flawless_1", icon:"💎", tier:"bronze", title:"Perfectionist", desc:"Finish a Sudoku with 0 mistakes",
    test:p=> (p.sudoku.flawlessCount||0) >= 1, progress:p=> `${Math.min(p.sudoku.flawlessCount||0,1)}/1`},
  {id:"flawless_10", icon:"✨", tier:"silver", title:"Flawless Season", desc:"Finish 10 Sudokus with 0 mistakes",
    test:p=> (p.sudoku.flawlessCount||0) >= 10, progress:p=> `${Math.min(p.sudoku.flawlessCount||0,10)}/10`},
  {id:"speed_60", icon:"⏱", tier:"bronze", title:"Qualifying Lap", desc:"Complete a level in under 60 seconds",
    test:p=> fastestTime(p) < 60, progress:p=> isFinite(fastestTime(p)) ? `Best: ${Math.round(fastestTime(p))}s (need <60s)` : "No times yet"},
  {id:"speed_30", icon:"⚡", tier:"silver", title:"Speed Demon", desc:"Complete a level in under 30 seconds",
    test:p=> fastestTime(p) < 30, progress:p=> isFinite(fastestTime(p)) ? `Best: ${Math.round(fastestTime(p))}s (need <30s)` : "No times yet"},
  {id:"streak_3", icon:"🔥", tier:"bronze", title:"Hat Trick", desc:"Win 3 levels in a row (any game)",
    test:p=> (p.streak||0) >= 3, progress:p=> `${Math.min(p.streak||0,3)}/3`},
  {id:"streak_10", icon:"🚀", tier:"gold", title:"Dominant Season", desc:"Win 10 levels in a row (any game)",
    test:p=> (p.streak||0) >= 10, progress:p=> `${Math.min(p.streak||0,10)}/10`},
  {id:"hint_1", icon:"💡", tier:"bronze", title:"Pit Crew Call", desc:"Use your first Sudoku hint",
    test:p=> (p.sudoku.hintsUsed||0) >= 1, progress:p=> `${Math.min(p.sudoku.hintsUsed||0,1)}/1`},
  {id:"hint_10", icon:"🧠", tier:"silver", title:"Strategic Genius", desc:"Use 10 Sudoku hints",
    test:p=> (p.sudoku.hintsUsed||0) >= 10, progress:p=> `${Math.min(p.sudoku.hintsUsed||0,10)}/10`},
  {id:"comeback", icon:"💪", tier:"silver", title:"Comeback King", desc:"Win a Sudoku after 2 mistakes",
    test:p=> (p.sudoku.comebackWins||0) >= 1, progress:p=> `${Math.min(p.sudoku.comebackWins||0,1)}/1`},
  {id:"sudoku_100", icon:"🔢", tier:"gold", title:"Sudoku Master", desc:"Complete all 100 Sudoku levels",
    test:p=> Object.keys(p.sudoku.times).length >= MAX_LEVEL, progress:p=> `${Object.keys(p.sudoku.times).length}/100`},
  {id:"wordhunt_100", icon:"🔤", tier:"gold", title:"Word Wizard", desc:"Complete all 100 Word Hunt levels",
    test:p=> Object.keys(p.wordhunt.times).length >= MAX_LEVEL, progress:p=> `${Object.keys(p.wordhunt.times).length}/100`},
  {id:"crossword_100", icon:"📝", tier:"gold", title:"Crossword Champion", desc:"Complete all 100 Crosswords",
    test:p=> Object.keys(p.crossword.times).length >= MAX_LEVEL, progress:p=> `${Object.keys(p.crossword.times).length}/100`},
  {id:"triple_100", icon:"🏅", tier:"platinum", title:"Triple Crown", desc:"Complete all 100 levels in every game",
    test:p=> ["sudoku","wordhunt","crossword"].every(g=> Object.keys(p[g].times).length >= MAX_LEVEL),
    progress:p=> `${["sudoku","wordhunt","crossword"].reduce((s,g)=>s+Object.keys(p[g].times).length,0)}/300`}
];

// Reward: every achievement grants +1 bonus Sudoku hint on unlock.
function checkAchievements(progress){
  const unlocked = loadAchievements();
  const newlyUnlocked = [];
  ACHIEVEMENTS.forEach(a=>{
    if(unlocked[a.id]) return;
    if(a.test(progress)){
      unlocked[a.id] = Date.now();
      newlyUnlocked.push(a);
    }
  });
  if(newlyUnlocked.length){
    saveAchievements(unlocked);
    progress.sudoku.hints = (progress.sudoku.hints||0) + newlyUnlocked.length;
    saveProgress(progress);
    newlyUnlocked.forEach((a,i)=> setTimeout(()=>{ sfxAchievement(); showAchievementToast(a); }, i*1600));
  }
}

function showAchievementToast(a){
  const toast = document.createElement("div");
  toast.className = "achToast";
  toast.style.setProperty("--tier-color", TIER_COLORS[a.tier]);
  toast.innerHTML = `<div class="achToastIcon badge" style="border-color:${TIER_COLORS[a.tier]}">${a.icon}</div>
    <div><div class="achToastLabel">Achievement Unlocked · +1 Hint</div>
    <div class="achToastTitle">${a.title}</div>
    <div class="achToastDesc">${a.desc}</div></div>`;
  document.body.appendChild(toast);
  requestAnimationFrame(()=> toast.classList.add("show"));
  setTimeout(()=>{
    toast.classList.remove("show");
    setTimeout(()=> toast.remove(), 400);
  }, 3600);
}
function fmtTime(s){
  const m = Math.floor(s/60), sec = s%60;
  return m+":"+String(sec).padStart(2,"0");
}

/* ============ Mid-game (in-progress) persistence ============
   Lets a player leave mid-puzzle (back to levels/menu, or close the
   tab) and pick up exactly where they left off on that same level. */
const INPROGRESS_KEY = "gridprix_inprogress_v1";
function loadAllInProgress(){
  try{ return JSON.parse(localStorage.getItem(INPROGRESS_KEY)) || {}; }catch(e){ return {}; }
}
function saveInProgress(gameId, level, state){
  const all = loadAllInProgress();
  all[gameId] = { level, state };
  localStorage.setItem(INPROGRESS_KEY, JSON.stringify(all));
}
function getInProgress(gameId, level){
  const entry = loadAllInProgress()[gameId];
  return (entry && entry.level === level) ? entry.state : null;
}
function clearInProgress(gameId){
  const all = loadAllInProgress();
  delete all[gameId];

/* ============ Timer helper ============ */
function Timer(onTick){
  let t=0, id=null;
  return {
    start(){ id = setInterval(()=>{ t++; onTick(t); }, 1000); },
    stop(){ clearInterval(id); },
    val(){ return t; },
    setVal(v){ t=v; onTick(t); }
  };
}

/* ============ SFX (synthesized via Web Audio — no asset files) ============ */
let sfxEnabled = localStorage.getItem("gridprix_sfx") !== "off";
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq, start, dur, type, vol){
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || "sine";
  osc.frequency.value = freq;
  const t0 = ctx.currentTime + start;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol||0.15, t0+0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0+dur+0.05);
}
function sfxClick(){ if(!sfxEnabled) return; try{ tone(880,0,0.06,"square",0.07); }catch(e){} }
function sfxError(){ if(!sfxEnabled) return; try{ tone(160,0,0.25,"sawtooth",0.12); }catch(e){} }
function sfxFound(){ if(!sfxEnabled) return; try{ tone(660,0,0.08,"triangle",0.12); tone(990,0.06,0.12,"triangle",0.1); }catch(e){} }
function sfxWin(){ if(!sfxEnabled) return; try{ [523,659,784,1047].forEach((f,i)=> tone(f,i*0.09,0.18,"triangle",0.12)); }catch(e){} }
function sfxLose(){ if(!sfxEnabled) return; try{ [400,320,240].forEach((f,i)=> tone(f,i*0.12,0.22,"sawtooth",0.1)); }catch(e){} }
function sfxAchievement(){ if(!sfxEnabled) return; try{ [784,988,1175,1568].forEach((f,i)=> tone(f,i*0.06,0.25,"sine",0.1)); }catch(e){} }

/* ============ Background music (original synthesized loop) ============
   Not the real F1 broadcast theme (copyrighted, licensed exclusively to
   F1) — a small original driving riff generated the same way as the SFX
   above, so it stays offline/self-contained with zero licensing risk. */
let bgmEnabled = localStorage.getItem("gridprix_bgm") !== "off";
let bgmTimer = null;
const BGM_BEAT = 60/128;
const BGM_BASS = [110,110,146.83,146.83,174.61,174.61,196,164.81];
const BGM_ARP  = [220,277.18,329.63,440];
function bgmLoop(){
  if(!bgmEnabled){ bgmTimer = null; return; }
  try{
    BGM_BASS.forEach((freq,i)=> tone(freq, i*BGM_BEAT, BGM_BEAT*0.9, "square", 0.045));
    for(let i=0;i<BGM_BASS.length*2;i++){
      tone(BGM_ARP[i % BGM_ARP.length], i*(BGM_BEAT/2), BGM_BEAT*0.35, "triangle", 0.028);
    }
  } catch(e){}
  bgmTimer = setTimeout(bgmLoop, BGM_BASS.length*BGM_BEAT*1000);
}
function startBgm(){ if(bgmTimer || !bgmEnabled) return; bgmLoop(); }
function stopBgm(){ if(bgmTimer){ clearTimeout(bgmTimer); bgmTimer = null; } }
function armBgmAutostart(){
  const starter = ()=>{ startBgm(); document.removeEventListener("pointerdown", starter); };
  document.addEventListener("pointerdown", starter, {once:true});
}

/* Offline submissions are queued per-game and flushed automatically once
   the browser regains connectivity, so playing offline never loses a
   leaderboard update — it just lands late. */
const LB_QUEUE_KEY = "gridprix_leaderboard_queue_v1";
function loadLbQueue(){ try{ return JSON.parse(localStorage.getItem(LB_QUEUE_KEY)) || {}; } catch(e){ return {}; } }
function saveLbQueue(q){ localStorage.setItem(LB_QUEUE_KEY, JSON.stringify(q)); }
async function flushLbQueue(){
  const backend = window.gridPrixLeaderboard;
  if(!backend || !backend.configured) return;
  const q = loadLbQueue();
  const gameIds = Object.keys(q);
  if(!gameIds.length) return;
  const idn = loadLbIdentity();
  for(const gameId of gameIds){
    const item = q[gameId];
    try{
      await backend.submit(gameId, idn.clientId, item.name, item.completed, item.carColor, item.helmet);
      delete q[gameId];
    } catch(e){ /* still offline or backend unreachable — stays queued */ }
  }
  saveLbQueue(q);
}
window.addEventListener("online", flushLbQueue);
window.addEventListener("load", flushLbQueue);

      card.innerHTML = `<div class="themeSwatch" style="background:linear-gradient(135deg,${t.accent},${t.accentDark})"></div>
        <div class="themeLabel">${t.label}${active ? " ✓" : ""}</div>`;
      card.onclick = ()=>{ applyTheme(t.id); draw(); };
      grid.appendChild(card);
    });
  }
  draw();
}
function renderAchievements(){
  tagline.textContent = "Every milestone you've unlocked on track";
  app.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "gamewrap";

  const topbar = document.createElement("div");
  topbar.className = "topbar";
  topbar.appendChild(backBtn());
  wrap.appendChild(topbar);

  const progress = loadProgress();
  const unlocked = loadAchievements();
  const unlockedCount = ACHIEVEMENTS.filter(a=>unlocked[a.id]).length;
  const progressLine = document.createElement("div");
  progressLine.className = "achProgress";
  progressLine.innerHTML = `${unlockedCount} of ${ACHIEVEMENTS.length} badges collected<br>
    <span style="color:var(--amber)">💡 Each one unlocks +1 bonus Sudoku hint</span>`;
  wrap.appendChild(progressLine);

  const grid = document.createElement("div");
  grid.id = "achGrid";
  ACHIEVEMENTS.forEach(a=>{
    const isUnlocked = !!unlocked[a.id];
    const color = TIER_COLORS[a.tier];
    const card = document.createElement("div");
    card.className = "achCard" + (isUnlocked ? "" : " locked");
    card.innerHTML = `<div class="achIcon badge" style="border-color:${isUnlocked ? color : "var(--gridline)"}">${isUnlocked ? a.icon : "🔒"}</div>

}

function backBtn(onclick, label){
  const b = document.createElement("button");
  b.className = "btn";
  b.textContent = label || "← Paddock";
  b.onclick = onclick || renderMenu;
  return b;
}

/* ============ Level select ============ */
function renderLevelSelect(gameId){
  const meta = GAME_META[gameId];
  tagline.textContent = meta.title + " — pick a level";
  const progress = loadProgress();
  const prog = progress[gameId];
  app.innerHTML = "";

  const wrap = document.createElement("div");
  wrap.className = "gamewrap";

  const topbar = document.createElement("div");
  topbar.className = "topbar";
  topbar.appendChild(backBtn());
  const nextUnplayed = document.createElement("button");
  nextUnplayed.className = "btn primary small";
  nextUnplayed.textContent = "Play Level " + prog.unlocked;
  nextUnplayed.onclick = ()=> startGame(gameId, prog.unlocked);
  topbar.appendChild(nextUnplayed);

  const lvlHeader = document.createElement("div");
  lvlHeader.className = "lvlHeader";
  lvlHeader.innerHTML = `<h2 style="margin:4px 0 0;">${meta.title}</h2>
    <div class="lvlProgress">Unlocked up to level ${prog.unlocked} of ${MAX_LEVEL} · ${Object.keys(prog.times).length} completed</div>`;

  const levelGrid = document.createElement("div");
  levelGrid.id = "levelGrid";
  for(let lvl=1; lvl<=MAX_LEVEL; lvl++){
    const b = document.createElement("button");
    b.className = "lvlbtn";
    const locked = lvl > prog.unlocked;
    if(locked) b.classList.add("locked");
    if(prog.times[lvl] != null) b.classList.add("done");
    if(lvl === prog.unlocked) b.classList.add("current");
    b.textContent = prog.times[lvl] != null ? "✓" : lvl;
    b.disabled = locked;
    b.onclick = ()=>{ if(!locked) startGame(gameId, lvl); };
    levelGrid.appendChild(b);
  }

  wrap.appendChild(topbar);
  wrap.appendChild(lvlHeader);
  wrap.appendChild(levelGrid);
  app.appendChild(wrap);
}

function startGame(gameId, level){
  if(gameId==="sudoku") renderSudoku(level);
  if(gameId==="wordhunt") renderWordHunt(level);
  if(gameId==="crossword") renderCrossword(level);
}

function winModal(gameId, level, seconds, extraText, meta){
  sfxWin();
  completeLevel(gameId, level, seconds, meta);
  const progress = loadProgress();
  const hasNext = level < MAX_LEVEL;
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal">
    <h2>🏁 Chequered Flag!</h2>
    <p>${GAME_META[gameId].short} · Level ${level}<br>${extraText||""}Time: <b style="color:#f2f2f2">${fmtTime(seconds)}</b></p>
    <div class="modalbtns">
      ${hasNext ? `<button class="btn primary" id="modalNextBtn">Next Level →</button>` : ""}
      <button class="btn" id="modalLevelsBtn">Level Select</button>
      <button class="btn" id="modalMenuBtn">Back to Paddock</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  if(hasNext) bg.querySelector("#modalNextBtn").onclick = ()=>{ bg.remove(); startGame(gameId, level+1); };
  bg.querySelector("#modalLevelsBtn").onclick = ()=>{ bg.remove(); renderLevelSelect(gameId); };
  bg.querySelector("#modalMenuBtn").onclick = ()=>{ bg.remove(); renderMenu(); };
}

/* =========================================================
   GAME 1: SUDOKU (9x9, boxes 3x3) — levels scale clues removed
   ========================================================= */
function renderSudoku(level){
  const meta = GAME_META.sudoku;
  tagline.textContent = meta.tag + "  ·  Level " + level;
  app.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "gamewrap";

  const rng = rngFor("sudoku", level);
  const t = difficultyT(level);
  const N = 9, BOX = 3;

  // Classic box-shift base pattern: guaranteed valid rows/cols/boxes.
  function genSolution(){
    const g = [];
    for(let r=0;r<N;r++){
      const row = [];
      for(let c=0;c<N;c++){
        row.push(((BOX*(r%BOX) + Math.floor(r/BOX) + c) % N) + 1);
      }
      g.push(row);
    }
    return g;
  }

  let solution = genSolution();
  const mapping = shuffleRng([1,2,3,4,5,6,7,8,9], rng);
  solution = solution.map(row=>row.map(v=>mapping[v-1]));
  function shuffleBands(grid){
    const bandOrder = shuffleRng([0,1,2], rng);
    const rowsWithinBand = [shuffleRng([0,1,2],rng), shuffleRng([0,1,2],rng), shuffleRng([0,1,2],rng)];
    const newGrid = [];
    bandOrder.forEach((band,i)=>{ rowsWithinBand[i].forEach(r=>{ newGrid.push(grid[band*BOX+r]); }); });
    return newGrid;
  }
  solution = shuffleBands(solution);
  function transpose(g){ return g[0].map((_,c)=>g.map(row=>row[c])); }
  solution = transpose(shuffleBands(transpose(solution)));

  // Difficulty: remove 36 (easy, ~45 clues) up to 54 (hard, ~27 clues) of the 81 cells.
  const removeCount = Math.round(36 + t*18);
  const puzzle = solution.map(row=>row.slice());
  const cellsIdx = [];
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) cellsIdx.push([r,c]);
  shuffleRng(cellsIdx, rng).slice(0, removeCount).forEach(([r,c])=>{ puzzle[r][c] = 0; });

  const given = puzzle.map(row=>row.map(v=>v!==0));
  const saved = getInProgress("sudoku", level);
  const board = saved ? saved.board : puzzle.map(row=>row.slice());
  const notes = saved
    ? saved.notes.map(row=>row.map(arr=>new Set(arr)))
    : Array.from({length:N},()=>Array.from({length:N},()=>new Set()));
  let selected = null;
  let notesMode = false;
  let mistakes = saved ? saved.mistakes : 0;
  let gameOver = false;

  const progressNow = loadProgress();
  let hintsAvailable = progressNow.sudoku.hints || 0;

  const topbar = document.createElement("div");
  topbar.className = "topbar";
  const timeStat = document.createElement("div"); timeStat.className="stat"; timeStat.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true"><path fill="currentColor" d="M179.594 20.688v41.406h143.25V20.687h-143.25zM256.03 82C143.04 82 51.25 173.727 51.25 286.656c0 112.93 91.788 204.656 204.78 204.656 112.994 0 204.75-91.728 204.75-204.656C460.78 173.73 369.025 82 256.03 82zm0 35.625c93.42 0 169.126 75.665 169.126 169.03 0 93.368-75.706 169.564-169.125 169.564-93.417 0-169.155-76.197-169.155-169.564 0-93.366 75.736-169.03 169.156-169.03zm76.19 20.28l-72.47 107.5c10.67 1.036 20.516 6.045 27.625 13.814l44.844-121.314zm-85.533 1.064v45.31c3.077-.275 6.196-.405 9.344-.405 3.155 0 6.263.13 9.345.406v-45.31h-18.688zm-88.53 36.655l-13.22 13.22L177 220.874c3.992-4.784 8.432-9.198 13.22-13.188l-32.064-32.062zm195.75 0l-32.063 32.063c4.786 3.99 9.196 8.403 13.187 13.187l32.064-32.03-13.188-13.22zm-98.344 81.22c-2.08.01-4.195.243-6.313.686-16.948 3.544-27.7 20.005-24.156 36.94 3.544 16.932 20.02 27.698 36.97 24.155 16.946-3.543 27.7-20.004 24.155-36.938-3.102-14.816-16.104-24.925-30.658-24.843zM108.28 277.31V296h45.314c-.278-3.08-.406-6.192-.406-9.344 0-3.146.13-6.27.406-9.344H108.28zm250.157 0c.277 3.075.438 6.197.438 9.344 0 3.153-.16 6.264-.438 9.344h45.344v-18.688H358.44zm-60.062 6.72c.993 10.522-1.968 20.742-7.813 28.937l124 19.092-116.187-48.03zM176.97 352.405l-32.032 32.03 13.218 13.22 32.063-32.03c-4.798-4-9.253-8.424-13.25-13.22zm158.093 0c-4 4.796-8.423 9.22-13.22 13.22l32.063 32.03 13.188-13.22-32.03-32.03zM246.688 389v45.313h18.687V389c-3.082.278-6.19.438-9.344.438-3.147 0-6.266-.16-9.342-.438z"/></svg><b>0:00</b>';
  const lvlStat = document.createElement("div"); lvlStat.className="stat"; lvlStat.innerHTML=`Level <b>${level}</b>/${MAX_LEVEL}`;
  const mistakeStat = document.createElement("div"); mistakeStat.className="stat";
  const controls = document.createElement("div"); controls.style.display="flex"; controls.style.gap="8px"; controls.style.flexWrap="wrap";
  const notesBtn = document.createElement("button"); notesBtn.className="btn small"; notesBtn.textContent="✎ Notes";
  notesBtn.onclick = ()=>{ notesMode = !notesMode; notesBtn.classList.toggle("primary", notesMode); };
  const hintBtn = document.createElement("button"); hintBtn.className="btn small";
  hintBtn.onclick = ()=>{
    if(gameOver || hintsAvailable<=0 || !selected) return;
    const [r,c] = selected;
    if(given[r][c] || board[r][c]===solution[r][c]) return;
    board[r][c] = solution[r][c];
    notes[r][c].clear();
    hintsAvailable--;
    const pr = loadProgress();
    pr.sudoku.hints = hintsAvailable;
    pr.sudoku.hintsUsed = (pr.sudoku.hintsUsed||0) + 1;
    saveProgress(pr);
    checkAchievements(pr);
    updateHintBtn();
    saveState();
    draw();
    celebrateCompletions(r,c);
    checkWin();
  };
  function updateHintBtn(){ hintBtn.textContent = `💡 Hint (${hintsAvailable})`; hintBtn.disabled = hintsAvailable<=0; }
  updateHintBtn();
  const retryBtn = document.createElement("button"); retryBtn.className="btn small"; retryBtn.textContent="Retry";
  retryBtn.onclick = ()=>{ clearInProgress("sudoku"); renderSudoku(level); };
  controls.appendChild(backBtn(()=>{ saveState(); renderLevelSelect("sudoku"); }, "← Levels"));
  controls.appendChild(notesBtn); controls.appendChild(hintBtn); controls.appendChild(retryBtn);
  topbar.appendChild(timeStat); topbar.appendChild(lvlStat); topbar.appendChild(mistakeStat); topbar.appendChild(controls);

  const gridEl = document.createElement("div");
  gridEl.id = "sudokuGrid";

  const msg = document.createElement("div"); msg.id="msg";

  const padEl = document.createElement("div");
  padEl.className = "padnum";

  wrap.appendChild(topbar);
  wrap.appendChild(gridEl);
  wrap.appendChild(msg);
  wrap.appendChild(padEl);
  app.appendChild(wrap);

  function updateMistakeStat(){ mistakeStat.innerHTML = `Mistakes <b>${mistakes}</b>/3`; }
  updateMistakeStat();

  function saveState(){
    saveInProgress("sudoku", level, {
      board: board.map(row=>row.slice()),
      notes: notes.map(row=>row.map(s=>[...s])),
      mistakes,
      elapsed: timer.val()
    });
  }

  const timer = Timer((t)=>{ timeStat.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true"><path fill="currentColor" d="M179.594 20.688v41.406h143.25V20.687h-143.25zM256.03 82C143.04 82 51.25 173.727 51.25 286.656c0 112.93 91.788 204.656 204.78 204.656 112.994 0 204.75-91.728 204.75-204.656C460.78 173.73 369.025 82 256.03 82zm0 35.625c93.42 0 169.126 75.665 169.126 169.03 0 93.368-75.706 169.564-169.125 169.564-93.417 0-169.155-76.197-169.155-169.564 0-93.366 75.736-169.03 169.156-169.03zm76.19 20.28l-72.47 107.5c10.67 1.036 20.516 6.045 27.625 13.814l44.844-121.314zm-85.533 1.064v45.31c3.077-.275 6.196-.405 9.344-.405 3.155 0 6.263.13 9.345.406v-45.31h-18.688zm-88.53 36.655l-13.22 13.22L177 220.874c3.992-4.784 8.432-9.198 13.22-13.188l-32.064-32.062zm195.75 0l-32.063 32.063c4.786 3.99 9.196 8.403 13.187 13.187l32.064-32.03-13.188-13.22zm-98.344 81.22c-2.08.01-4.195.243-6.313.686-16.948 3.544-27.7 20.005-24.156 36.94 3.544 16.932 20.02 27.698 36.97 24.155 16.946-3.543 27.7-20.004 24.155-36.938-3.102-14.816-16.104-24.925-30.658-24.843zM108.28 277.31V296h45.314c-.278-3.08-.406-6.192-.406-9.344 0-3.146.13-6.27.406-9.344H108.28zm250.157 0c.277 3.075.438 6.197.438 9.344 0 3.153-.16 6.264-.438 9.344h45.344v-18.688H358.44zm-60.062 6.72c.993 10.522-1.968 20.742-7.813 28.937l124 19.092-116.187-48.03zM176.97 352.405l-32.032 32.03 13.218 13.22 32.063-32.03c-4.798-4-9.253-8.424-13.25-13.22zm158.093 0c-4 4.796-8.423 9.22-13.22 13.22l32.063 32.03 13.188-13.22-32.03-32.03zM246.688 389v45.313h18.687V389c-3.082.278-6.19.438-9.344.438-3.147 0-6.266-.16-9.342-.438z"/></svg><b>${fmtTime(t)}</b>`;
    if(t % 5 === 0) saveState();
  });
  timer.start();
  if(saved && saved.elapsed) timer.setVal(saved.elapsed);

  function loseModal(){
    gameOver = true;
    timer.stop();
    sfxLose();
    clearInProgress("sudoku");
    resetStreak();
    const bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML = `<div class="modal">
      <h2>🏁 Crashed Out</h2>
      <p>3 mistakes — this attempt is over.<br>Level ${level} resets fresh.</p>
      <div class="modalbtns">
        <button class="btn primary" id="loseRetryBtn">Retry Level</button>
        <button class="btn" id="loseLevelsBtn">Level Select</button>
        <button class="btn" id="losePaddockBtn">Back to Paddock</button>
      </div>
    </div>`;
    document.body.appendChild(bg);
    bg.querySelector("#loseRetryBtn").onclick = ()=>{ bg.remove(); renderSudoku(level); };
    bg.querySelector("#loseLevelsBtn").onclick = ()=>{ bg.remove(); renderLevelSelect("sudoku"); };
    bg.querySelector("#losePaddockBtn").onclick = ()=>{ bg.remove(); renderMenu(); };
  }

  function isRowComplete(r){ for(let c=0;c<N;c++) if(board[r][c]!==solution[r][c]) return false; return true; }
  function isColComplete(c){ for(let r=0;r<N;r++) if(board[r][c]!==solution[r][c]) return false; return true; }
  function isBoxComplete(r,c){
    const br=Math.floor(r/BOX)*BOX, bc=Math.floor(c/BOX)*BOX;
    for(let rr=br; rr<br+BOX; rr++) for(let cc=bc; cc<bc+BOX; cc++) if(board[rr][cc]!==solution[rr][cc]) return false;
    return true;
  }
  function burstCell(idx){
    const el = gridEl.children[idx];
    if(!el) return;
    el.classList.remove("sc-burst"); void el.offsetWidth;
    el.classList.add("sc-burst");
    setTimeout(()=> el.classList.remove("sc-burst"), 650);
  }
  function celebrateCompletions(r,c){
    const cells = new Set();
    if(isRowComplete(r)) for(let cc=0;cc<N;cc++) cells.add(r*N+cc);
    if(isColComplete(c)) for(let rr=0;rr<N;rr++) cells.add(rr*N+c);
    if(isBoxComplete(r,c)){
      const br=Math.floor(r/BOX)*BOX, bc=Math.floor(c/BOX)*BOX;
      for(let rr=br; rr<br+BOX; rr++) for(let cc=bc; cc<bc+BOX; cc++) cells.add(rr*N+cc);
    }
    cells.forEach(burstCell);
  }
  function celebrateGrid(){
    gridEl.classList.remove("sc-grid-complete"); void gridEl.offsetWidth;
    gridEl.classList.add("sc-grid-complete");
    for(let idx=0; idx<N*N; idx++) setTimeout(()=> burstCell(idx), idx*10);
  }

  function conflicts(r,c,val){
    if(!val) return false;
    for(let i=0;i<N;i++){
      if(i!==c && board[r][i]===val) return true;
      if(i!==r && board[i][c]===val) return true;
    }
    const br = Math.floor(r/BOX)*BOX, bc = Math.floor(c/BOX)*BOX;
    for(let rr=br; rr<br+BOX; rr++) for(let cc=bc; cc<bc+BOX; cc++){
      if((rr!==r||cc!==c) && board[rr][cc]===val) return true;
    }
    return false;
  }

  function draw(){
    gridEl.innerHTML = "";
    for(let r=0;r<N;r++){
      for(let c=0;c<N;c++){
        const cell = document.createElement("div");
        cell.className = "sc";
        if(given[r][c]) cell.classList.add("given");
        if(c===2 || c===5) cell.classList.add("boxR");
        if(r===2 || r===5) cell.classList.add("boxB");
        if(selected && selected[0]===r && selected[1]===c) cell.classList.add("selected");
        const val = board[r][c];
        if(val){
          cell.textContent = val;
          if(!given[r][c]){
            cell.classList.add("filled");
            if(conflicts(r,c,val)) cell.classList.add("conflict");
          }
        } else if(notes[r][c].size){
          const ng = document.createElement("div");
          ng.className = "notesGrid";
          for(let n=1;n<=9;n++){
            const s = document.createElement("span");
            s.textContent = notes[r][c].has(n) ? n : "";
            ng.appendChild(s);
          }
          cell.appendChild(ng);
        }
        cell.onclick = ()=>{
          if(gameOver || given[r][c]) return;
          selected = [r,c];
          draw();
        };
        gridEl.appendChild(cell);
      }
    }
  }

  for(let n=1;n<=9;n++){
    const b = document.createElement("button");
    b.textContent = n;
    b.onclick = ()=>{
      if(gameOver || !selected) return;
      const [r,c] = selected;
      if(given[r][c]) return;
      if(notesMode){
        if(board[r][c]) return;
        const s = notes[r][c];
        s.has(n) ? s.delete(n) : s.add(n);
        draw();
        saveState();
        return;
      }
      const wasCorrectAlready = board[r][c] === solution[r][c];
      board[r][c] = n;
      notes[r][c].clear();
      if(n !== solution[r][c] && !wasCorrectAlready){
        sfxError();
        mistakes++;
        updateMistakeStat();
        if(mistakes >= 3){ draw(); saveState(); loseModal(); return; }
      } else {
        sfxClick();
      }
      draw();
      saveState();
      if(n === solution[r][c]) celebrateCompletions(r,c);
      checkWin();
    };
    padEl.appendChild(b);
  }
  const eraseBtn = document.createElement("button");
  eraseBtn.textContent = "⌫";
  eraseBtn.onclick = ()=>{
    if(gameOver || !selected) return;
    const [r,c] = selected;
    if(given[r][c]) return;
    if(board[r][c]) board[r][c] = 0;
    else notes[r][c].clear();
    draw();
    saveState();
  };
  padEl.appendChild(eraseBtn);

  function checkWin(){
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      if(board[r][c]===0 || board[r][c]!==solution[r][c]) return;
    }
    timer.stop();
    clearInProgress("sudoku");
    msg.textContent = "Perfect lap! Grid complete.";
    celebrateGrid();
    const extra = mistakes===0 ? "Flawless sudoku — no mistakes. " : `Finished with ${mistakes} mistake${mistakes===1?"":"s"}. `;
    setTimeout(()=> winModal("sudoku", level, timer.val(), extra, {mistakes}), 1000);
  }

  draw();
}

const CATEGORY_NAMES = Object.keys(F1_CATEGORIES);
const ALL_F1_WORDS = CATEGORY_NAMES.flatMap(cat => F1_CATEGORIES[cat]);

// Picks a themed word pool for a level: rotates through categories so
// nearby levels don't repeat the same theme, and pulls in a second
// category if the primary one is too small for the requested count.
function wordsForLevel(level, minCount, maxLen){
  const catIdx = level % CATEGORY_NAMES.length;
  const primaryName = CATEGORY_NAMES[catIdx];
  let pool = F1_CATEGORIES[primaryName].filter(e=>!maxLen || e.w.length<=maxLen);
  let categoryLabel = primaryName;
  if(pool.length < minCount){
    const secondaryName = CATEGORY_NAMES[(catIdx+1)%CATEGORY_NAMES.length];
    const extra = F1_CATEGORIES[secondaryName].filter(e=>!maxLen || e.w.length<=maxLen);
    pool = pool.concat(extra);
    categoryLabel = primaryName + " + " + secondaryName;
  }
  return { entries: pool, categoryLabel };
}

/* =========================================================
   GAME 3: CROSSWORD — a real interlocking grid built from a shared
   word bank. Words are placed one at a time, each new word required
   to cross an already-placed word at a matching letter (like a real
   crossword), with adjacency checks so words never accidentally
   fuse together. Levels scale how many words get placed.
   ========================================================= */
function buildInterlockingCrosswordAttempt(words, rng){
  const cellLetter = {};
  const placed = [];
  function key(r,c){ return r+","+c; }

  function canPlace(word, row, col, dir){
    const dr = dir==="D"?1:0, dc = dir==="A"?1:0;
    if(cellLetter[key(row-dr, col-dc)] !== undefined) return false;
    if(cellLetter[key(row+dr*word.length, col+dc*word.length)] !== undefined) return false;
    let crossings = 0;
    for(let i=0;i<word.length;i++){
      const r = row+dr*i, c = col+dc*i;
      const existing = cellLetter[key(r,c)];
      if(existing !== undefined){
        if(existing !== word[i]) return false;
        crossings++;
      } else {
        // perpendicular neighbors must be empty so parallel words never touch directly
        if(cellLetter[key(r+dc, c+dr)] !== undefined) return false;
        if(cellLetter[key(r-dc, c-dr)] !== undefined) return false;
      }
    }
    return crossings;
  }

  function place(entry, row, col, dir){
    const dr = dir==="D"?1:0, dc = dir==="A"?1:0;
    for(let i=0;i<entry.w.length;i++){
      cellLetter[key(row+dr*i, col+dc*i)] = entry.w[i];
    }
    placed.push({answer:entry.w, clue:entry.clue, row, col, dir});
  }

  place(words[0], 0, 0, "A");

  let remaining = words.slice(1);
  for(let pass=0; pass<8 && remaining.length; pass++){
    const stillRemaining = [];
    remaining.forEach(entry=>{
      const candidates = [];
      for(let i=0;i<entry.w.length;i++){
        const letter = entry.w[i];
        Object.keys(cellLetter).forEach(k=>{
          if(cellLetter[k] !== letter) return;
          const [er,ec] = k.split(",").map(Number);
          const acrossRow = er, acrossCol = ec - i;
          if(canPlace(entry.w, acrossRow, acrossCol, "A")) candidates.push([acrossRow, acrossCol, "A"]);
          const downRow = er - i, downCol = ec;
          if(canPlace(entry.w, downRow, downCol, "D")) candidates.push([downRow, downCol, "D"]);
        });
      }
      if(candidates.length){
        const [row,col,dir] = shuffleRng(candidates, rng)[0];
        place(entry, row, col, dir);
      } else {
        stillRemaining.push(entry);
      }
    });
    remaining = stillRemaining;
  }

  let minR=Infinity,minC=Infinity,maxR=-Infinity,maxC=-Infinity;
  placed.forEach(e=>{
    const dr = e.dir==="D"?1:0, dc = e.dir==="A"?1:0;
    for(let i=0;i<e.answer.length;i++){
      const r=e.row+dr*i, c=e.col+dc*i;
      minR=Math.min(minR,r); maxR=Math.max(maxR,r);
      minC=Math.min(minC,c); maxC=Math.max(maxC,c);
    }
  });
  placed.forEach(e=>{ e.row -= minR; e.col -= minC; });
  return { entries: placed, rows: maxR-minR+1, cols: maxC-minC+1 };
}

// Runs several placement attempts (different tie-break orderings, always led by
// the longest word for a strong anchor) and keeps whichever fits the most words in.
function buildInterlockingCrossword(words, rng){
  let best = null;
  for(let attempt=0; attempt<6; attempt++){
    const order = shuffleRng(words, rng).sort((a,b)=> b.w.length - a.w.length);
    const result = buildInterlockingCrosswordAttempt(order, rng);
    if(!best || result.entries.length > best.entries.length) best = result;
    if(best.entries.length === words.length) break;
  }
  return best;
}

function renderCrossword(level){
  const meta = GAME_META.crossword;
  const rng = rngFor("crossword", level);
  const t = difficultyT(level);
  const wordCount = clamp(Math.round(6 + t*10), 6, 16);
  tagline.textContent = meta.tag + "  ·  Level " + level;
  app.innerHTML = "";

  const chosen = shuffleRng(ALL_F1_WORDS, rng).slice(0, wordCount);
  const placementOrder = chosen.slice().sort((a,b)=> b.w.length - a.w.length);

  const built = buildInterlockingCrossword(placementOrder, rng);
  const entries = built.entries;
  const rows = built.rows, cols = built.cols;

  function keyRC(r,c){ return r+","+c; }
  const startCells = {};
  entries.forEach(e=>{ startCells[keyRC(e.row,e.col)] = true; });
  const numberOf = {};
  let num = 1;
  const sortedStarts = Object.keys(startCells).map(k=>k.split(",").map(Number)).sort((a,b)=> a[0]-b[0] || a[1]-b[1]);
  sortedStarts.forEach(([r,c])=>{ numberOf[keyRC(r,c)] = num++; });
  entries.forEach(e=>{ e.number = numberOf[keyRC(e.row,e.col)]; });

  const wrap = document.createElement("div");
  wrap.className = "gamewrap";

  const topbar = document.createElement("div");
  topbar.className = "topbar";
  const timeStat = document.createElement("div"); timeStat.className="stat"; timeStat.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true"><path fill="currentColor" d="M179.594 20.688v41.406h143.25V20.687h-143.25zM256.03 82C143.04 82 51.25 173.727 51.25 286.656c0 112.93 91.788 204.656 204.78 204.656 112.994 0 204.75-91.728 204.75-204.656C460.78 173.73 369.025 82 256.03 82zm0 35.625c93.42 0 169.126 75.665 169.126 169.03 0 93.368-75.706 169.564-169.125 169.564-93.417 0-169.155-76.197-169.155-169.564 0-93.366 75.736-169.03 169.156-169.03zm76.19 20.28l-72.47 107.5c10.67 1.036 20.516 6.045 27.625 13.814l44.844-121.314zm-85.533 1.064v45.31c3.077-.275 6.196-.405 9.344-.405 3.155 0 6.263.13 9.345.406v-45.31h-18.688zm-88.53 36.655l-13.22 13.22L177 220.874c3.992-4.784 8.432-9.198 13.22-13.188l-32.064-32.062zm195.75 0l-32.063 32.063c4.786 3.99 9.196 8.403 13.187 13.187l32.064-32.03-13.188-13.22zm-98.344 81.22c-2.08.01-4.195.243-6.313.686-16.948 3.544-27.7 20.005-24.156 36.94 3.544 16.932 20.02 27.698 36.97 24.155 16.946-3.543 27.7-20.004 24.155-36.938-3.102-14.816-16.104-24.925-30.658-24.843zM108.28 277.31V296h45.314c-.278-3.08-.406-6.192-.406-9.344 0-3.146.13-6.27.406-9.344H108.28zm250.157 0c.277 3.075.438 6.197.438 9.344 0 3.153-.16 6.264-.438 9.344h45.344v-18.688H358.44zm-60.062 6.72c.993 10.522-1.968 20.742-7.813 28.937l124 19.092-116.187-48.03zM176.97 352.405l-32.032 32.03 13.218 13.22 32.063-32.03c-4.798-4-9.253-8.424-13.25-13.22zm158.093 0c-4 4.796-8.423 9.22-13.22 13.22l32.063 32.03 13.188-13.22-32.03-32.03zM246.688 389v45.313h18.687V389c-3.082.278-6.19.438-9.344.438-3.147 0-6.266-.16-9.342-.438z"/></svg><b>0:00</b>';
  const lvlStat = document.createElement("div"); lvlStat.className="stat"; lvlStat.innerHTML=`Level <b>${level}</b>/${MAX_LEVEL}`;
  const controls = document.createElement("div"); controls.style.display="flex"; controls.style.gap="8px";
  const checkBtn = document.createElement("button"); checkBtn.className="btn small"; checkBtn.textContent="Check";
  const retryBtn = document.createElement("button"); retryBtn.className="btn small"; retryBtn.textContent="Retry";
  retryBtn.onclick = ()=>{ clearInProgress("crossword"); renderCrossword(level); };
  controls.appendChild(backBtn(()=>{ saveCWState(); renderLevelSelect("crossword"); }, "← Levels"));
  controls.appendChild(checkBtn); controls.appendChild(retryBtn);
  topbar.appendChild(timeStat); topbar.appendChild(lvlStat); topbar.appendChild(controls);

  const clueBar = document.createElement("div");
  clueBar.id = "cwClue";
  clueBar.textContent = "Tap a cell to begin";

  const gridEl = document.createElement("div");
  gridEl.id = "cwGrid";
  gridEl.style.gridTemplateColumns = `repeat(${cols},1fr)`;

  const clueList = document.createElement("div");
  clueList.id = "cwClueList";

  const msg = document.createElement("div"); msg.id="msg";

  wrap.appendChild(topbar);
  wrap.appendChild(clueBar);
  wrap.appendChild(gridEl);
  wrap.appendChild(msg);
  wrap.appendChild(clueList);
  app.appendChild(wrap);

  const timer = Timer((t)=>{
    timeStat.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true"><path fill="currentColor" d="M179.594 20.688v41.406h143.25V20.687h-143.25zM256.03 82C143.04 82 51.25 173.727 51.25 286.656c0 112.93 91.788 204.656 204.78 204.656 112.994 0 204.75-91.728 204.75-204.656C460.78 173.73 369.025 82 256.03 82zm0 35.625c93.42 0 169.126 75.665 169.126 169.03 0 93.368-75.706 169.564-169.125 169.564-93.417 0-169.155-76.197-169.155-169.564 0-93.366 75.736-169.03 169.156-169.03zm76.19 20.28l-72.47 107.5c10.67 1.036 20.516 6.045 27.625 13.814l44.844-121.314zm-85.533 1.064v45.31c3.077-.275 6.196-.405 9.344-.405 3.155 0 6.263.13 9.345.406v-45.31h-18.688zm-88.53 36.655l-13.22 13.22L177 220.874c3.992-4.784 8.432-9.198 13.22-13.188l-32.064-32.062zm195.75 0l-32.063 32.063c4.786 3.99 9.196 8.403 13.187 13.187l32.064-32.03-13.188-13.22zm-98.344 81.22c-2.08.01-4.195.243-6.313.686-16.948 3.544-27.7 20.005-24.156 36.94 3.544 16.932 20.02 27.698 36.97 24.155 16.946-3.543 27.7-20.004 24.155-36.938-3.102-14.816-16.104-24.925-30.658-24.843zM108.28 277.31V296h45.314c-.278-3.08-.406-6.192-.406-9.344 0-3.146.13-6.27.406-9.344H108.28zm250.157 0c.277 3.075.438 6.197.438 9.344 0 3.153-.16 6.264-.438 9.344h45.344v-18.688H358.44zm-60.062 6.72c.993 10.522-1.968 20.742-7.813 28.937l124 19.092-116.187-48.03zM176.97 352.405l-32.032 32.03 13.218 13.22 32.063-32.03c-4.798-4-9.253-8.424-13.25-13.22zm158.093 0c-4 4.796-8.423 9.22-13.22 13.22l32.063 32.03 13.188-13.22-32.03-32.03zM246.688 389v45.313h18.687V389c-3.082.278-6.19.438-9.344.438-3.147 0-6.266-.16-9.342-.438z"/></svg><b>${fmtTime(t)}</b>`;
    if(t % 5 === 0) saveCWState();
  });

  const cellData = {};
  entries.forEach(e=>{
    for(let i=0;i<e.answer.length;i++){
      const r = e.dir==="D" ? e.row+i : e.row;
      const c = e.dir==="A" ? e.col+i : e.col;
      const k = keyRC(r,c);
      if(!cellData[k]) cellData[k] = {letter:e.answer[i], entries:[]};
      cellData[k].entries.push(e);
    }
  });

  let activeEntry = entries[0];

  function drawGrid(){
    gridEl.innerHTML = "";
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const k = keyRC(r,c);
        const cell = document.createElement("div");
        if(!cellData[k]){
          cell.className = "cc block";
          gridEl.appendChild(cell);
          continue;
        }
        cell.className = "cc";
        cell.dataset.r=r; cell.dataset.c=c;
        if(numberOf[k]) {
          const numEl = document.createElement("div");
          numEl.className = "clueNum";
          numEl.textContent = numberOf[k];
          cell.appendChild(numEl);
        }
        const input = document.createElement("input");
        input.maxLength = 1;
        input.autocomplete = "off";
        input.addEventListener("focus", ()=>{
          activeEntry = cellData[k].entries.find(e=>e===activeEntry) || cellData[k].entries[0];
          setActive(r,c);
        });
        input.addEventListener("input", ()=>{
          input.value = input.value.toUpperCase().replace(/[^A-Z]/,"");
          if(input.value){ sfxClick(); moveNext(r,c); }
        });
        input.addEventListener("keydown", (ev)=>{
          if(ev.key === "Backspace" && !input.value){ moveBack(r,c); }
          if(ev.key === "ArrowRight") moveDir(r,c,0,1);
          if(ev.key === "ArrowLeft") moveDir(r,c,0,-1);
          if(ev.key === "ArrowDown") moveDir(r,c,1,0);
          if(ev.key === "ArrowUp") moveDir(r,c,-1,0);
        });
        cell.appendChild(input);
        cellData[k].inputEl = input;
        gridEl.appendChild(cell);
      }
    }
  }

  function moveDir(r,c,dr,dc){
    const k = keyRC(r+dr,c+dc);
    if(cellData[k]) cellData[k].inputEl.focus();
  }
  function moveNext(r,c){
    if(!activeEntry) return;
    const idx = activeEntry.dir==="A" ? c-activeEntry.col : r-activeEntry.row;
    const nr = activeEntry.dir==="D" ? activeEntry.row+idx+1 : r;
    const nc = activeEntry.dir==="A" ? activeEntry.col+idx+1 : c;
    const k = keyRC(nr,nc);
    if(cellData[k]) cellData[k].inputEl.focus();
    saveCWState();
    checkComplete();
  }

  function saveCWState(){
    const values = {};
    Object.keys(cellData).forEach(k=>{
      if(cellData[k].inputEl.value) values[k] = cellData[k].inputEl.value;
    });
    saveInProgress("crossword", level, { values, elapsed: timer.val() });
  }
  function moveBack(r,c){
    if(!activeEntry) return;
    const idx = activeEntry.dir==="A" ? c-activeEntry.col : r-activeEntry.row;
    const nr = activeEntry.dir==="D" ? activeEntry.row+idx-1 : r;
    const nc = activeEntry.dir==="A" ? activeEntry.col+idx-1 : c;
    const k = keyRC(nr,nc);
    if(cellData[k]) cellData[k].inputEl.focus();
  }

  function setActive(r,c){
    document.querySelectorAll(".cc").forEach(el=>el.classList.remove("active"));
    if(activeEntry){
      for(let i=0;i<activeEntry.answer.length;i++){
        const rr = activeEntry.dir==="D"? activeEntry.row+i : activeEntry.row;
        const cc = activeEntry.dir==="A"? activeEntry.col+i : activeEntry.col;
        const el = gridEl.children[rr*cols+cc];
        if(el) el.classList.add("active");
      }
      clueBar.textContent = `${activeEntry.number}${activeEntry.dir==="A"?"A":"D"}: ${activeEntry.clue}`;
    }
  }

  function drawClueList(){
    clueList.innerHTML = "";
    const across = entries.filter(e=>e.dir==="A");
    const down = entries.filter(e=>e.dir==="D");
    function section(title, list){
      const g = document.createElement("div"); g.className="grp";
      const h = document.createElement("b"); h.textContent = title;
      g.appendChild(h);
      list.forEach(e=>{
        const line = document.createElement("div");
        line.className = "line";
        line.textContent = `${e.number}. ${e.clue} (${e.answer.length})`;
        line.onclick = ()=>{
          activeEntry = e;
          const k = keyRC(e.row,e.col);
          cellData[k].inputEl.focus();
          setActive(e.row,e.col);
        };
        g.appendChild(line);
      });
      clueList.appendChild(g);
    }
    section("ACROSS", across);
    section("DOWN", down);
  }

  function checkComplete(){
    let allFilled = true;
    let allCorrect = true;
    Object.keys(cellData).forEach(k=>{
      const d = cellData[k];
      if(!d.inputEl.value) allFilled = false;
      if(d.inputEl.value !== d.letter) allCorrect = false;
    });
    if(allFilled){
      if(allCorrect){
        timer.stop();
        clearInProgress("crossword");
        setTimeout(()=> winModal("crossword", level, timer.val(), "Every answer correct. "), 300);
      } else {
        msg.className = "err";
        msg.textContent = "Grid full but something's off — check for errors.";
      }
    }
  }

  checkBtn.onclick = ()=>{
    let correctCount = 0, total = 0;
    Object.keys(cellData).forEach(k=>{
      const d = cellData[k];
      total++;
      const cellEl = d.inputEl.parentElement;
      cellEl.classList.remove("wrong","correct");
      if(d.inputEl.value){
        if(d.inputEl.value === d.letter){ cellEl.classList.add("correct"); correctCount++; }
        else cellEl.classList.add("wrong");
      }
    });
    msg.className = "";
    msg.textContent = `${correctCount}/${total} letters correct so far.`;
  };

  drawGrid();
  drawClueList();

  const savedCW = getInProgress("crossword", level);
  if(savedCW && savedCW.values){
    Object.keys(savedCW.values).forEach(k=>{
      if(cellData[k]) cellData[k].inputEl.value = savedCW.values[k];
    });
  }

  activeEntry = entries[0];
  const firstKey = keyRC(entries[0].row, entries[0].col);
  cellData[firstKey].inputEl.focus();
  setActive(entries[0].row, entries[0].col);

  timer.start();
  if(savedCW && savedCW.elapsed) timer.setVal(savedCW.elapsed);
}

/* ============ Decorative race lane: 22 generic cars, one grid's worth ============
   Colors only (11 current-team accent hexes, no names/logos/liveries attached
   anywhere in the UI); no numbers, no driver identities. Pure background flair. */
const RACE_ACCENT_COLORS = ["#FF8000","#E80020","#3671C6","#27F4D2","#00665E","#FF87BC","#64C4FF","#6692FF","#E6002B","#C8CED4","#F2F2F2"];
function carSVG(){
  // Bold open-wheel pictogram tuned to read at ~70px: oversized exposed
  // wheels (the #1 visual cue vs. a road car), a low pointed nose, a
  // cockpit hump, and a rear wing raised clear of the body on a pylon.
  // Original geometric shape — no team livery, sponsor marks, or logos.
  return `<svg viewBox="0 0 220 100" xmlns="http://www.w3.org/2000/svg">
    <rect x="192" y="28" width="6" height="34" fill="currentColor"/>
    <rect x="174" y="20" width="36" height="9" fill="currentColor"/>
    <path d="M2,70 L18,56 Q40,42 68,42 Q95,40 128,44 L162,52 L172,56 L172,66 L140,70 L58,72 L18,72 Z" fill="currentColor"/>
    <ellipse cx="100" cy="40" rx="15" ry="11" fill="currentColor"/>
    <rect x="0" y="65" width="20" height="6" fill="currentColor"/>
    <g class="wheel"><circle cx="38" cy="74" r="23" fill="#0c0c0e" stroke="currentColor" stroke-width="6"/><line x1="38" y1="55" x2="38" y2="93" stroke="currentColor" stroke-width="3"/><line x1="19" y1="74" x2="57" y2="74" stroke="currentColor" stroke-width="3"/></g>
    <g class="wheel"><circle cx="158" cy="72" r="25" fill="#0c0c0e" stroke="currentColor" stroke-width="6"/><line x1="158" y1="51" x2="158" y2="93" stroke="currentColor" stroke-width="3"/><line x1="137" y1="72" x2="179" y2="72" stroke="currentColor" stroke-width="3"/></g>
  </svg>`;
}
function buildRaceLane(){
  const lane = document.getElementById("raceLane");
  if(!lane) return;
  const total = 22;
  const styleEl = document.createElement("style");
  let keyframesCSS = "@keyframes raceEnter{from{left:-90px;}to{left:100%;}}";
  let entrance = 0.3;
  for(let i=0;i<total;i++){
    const color = RACE_ACCENT_COLORS[i % RACE_ACCENT_COLORS.length];
    const car = document.createElement("div");
    car.className = "raceCar";
    car.style.color = color;
    car.style.left = (i/(total-1)*94).toFixed(1) + "%"; // static spread, used only for reduced-motion

    // Each car mostly waits off-screen and only zooms across briefly, so the
    // steady-state visible count stays low (~1-3) no matter how many cars exist.
    const crossDur = 1.1 + Math.random()*0.8;   // 1.1-1.9s: fast zoom across the lane
    const cycleDur = 13 + Math.random()*7;      // 13-20s: mostly spent hidden, waiting
    const holdPct = ((cycleDur - crossDur) / cycleDur * 100).toFixed(2);
    const loopName = `raceLoop_${i}`;
    keyframesCSS += `@keyframes ${loopName}{0%{left:-90px;}${holdPct}%{left:-90px;}100%{left:100%;}}`;

    // Phase 1: quick staggered first entrance (one-shot, short delay).
    car.style.animationName = "raceEnter";
    car.style.animationDuration = crossDur.toFixed(2) + "s";
    car.style.animationDelay = entrance.toFixed(2) + "s";
    car.style.animationIterationCount = "1";
    car.style.animationFillMode = "backwards";
    car.addEventListener("animationend", function onFirstLap(){
      car.removeEventListener("animationend", onFirstLap);
      // Phase 2: switch to the sparse long-hold repeating loop.
      car.style.animationName = loopName;
      car.style.animationDuration = cycleDur.toFixed(2) + "s";
      car.style.animationDelay = "0s";
      car.style.animationIterationCount = "infinite";
    }, { once: true });

    entrance += 0.5 + Math.random()*0.9;
    car.innerHTML = carSVG();
    lane.appendChild(car);
  }
  styleEl.textContent = keyframesCSS;
  document.head.appendChild(styleEl);
}

      <li><div class="stepIcon">${shareIcon}</div><div class="stepText"><b>iPhone / iPad — Safari</b><span>Visit the site once, tap the Share icon, then "Add to Home Screen". It'll open full-screen like a normal app.</span></div></li>

armBgmAutostart();
